<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Plainsight Connect – returning you to the app</title>
<style>body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f7f2e8;color:#1f3b3a;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:520px;padding:32px;text-align:center}a{color:#0f7c78}</style>
</head><body><main>
<h1>Returning you to Plainsight Connect…</h1>
<p>This page only forwards your sign-in back to the Plainsight Connect tool running on your own computer. It stores nothing.</p>
<p id="manual" hidden>If nothing happens, make sure Plainsight Connect is running, then <a id="link" href="#">click here</a>.</p>
</main>
<script>
(function () {
  var target = "http://localhost:8765/callback" + window.location.search;
  document.getElementById("link").href = target;
  setTimeout(function () { document.getElementById("manual").hidden = false; }, 2500);
  if (window.location.search) window.location.replace(target);
})();
</script>
</body></html>
